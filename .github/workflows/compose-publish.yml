# .github/workflows/compose-publish.yml
name: Build, Train & Predict

on:
  push:
    branches:
      - master
      - develop
      
  schedule:
    # every day at 05:00 UTC
    - cron: "00 05 * * *"
  workflow_dispatch:  # manual trigger in UI

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push images
        run: |
          docker compose -f docker-compose.yml build
          docker compose -f docker-compose.yml push trainer
          docker compose -f docker-compose.yml push predictor

      - name: Run training
        run: |
          docker compose -f docker-compose.yml run --rm trainer

      - name: Run prediction
        run: |
          docker compose -f docker-compose.yml run --rm predictor